<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro - Portfólio</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>

<body>

    <div class="center">

        <h1>Cadastro</h1>


        <form id="cadastroForm">

            <div class="txt_field">

                <input
                    type="text"
                    id="nome"
                    required
                >

                <label for="nome">
                    Nome
                </label>

                <span></span>

            </div>


            <div class="txt_field">

                <input
                    type="email"
                    id="email"
                    required
                >

                <label for="email">
                    E-mail
                </label>

                <span></span>

            </div>


            <div class="txt_field">

                <input
                    type="password"
                    id="senha"
                    required
                >

                <label for="senha">
                    Senha
                </label>

                <span></span>

            </div>


            <div class="txt_field">

                <input
                    type="password"
                    id="confirmarSenha"
                    required
                >

                <label for="confirmarSenha">
                    Confirmar senha
                </label>

                <span></span>

            </div>


            <input
                type="submit"
                value="Cadastrar"
            >


            <p id="mensagemCadastro"></p>


            <div class="signup_link">

                <a href="index.html">
                    Já tenho uma conta
                </a>

            </div>

        </form>

    </div>


    <script src="cadastro.js"></script>

</body>

</html>

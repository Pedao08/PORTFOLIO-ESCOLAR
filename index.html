<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Portfólio</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>

<body>

    <div class="center">

        <h1>Login</h1>


        <form id="loginForm">

            <div class="txt_field">

                <input
                    type="email"
                    id="email"
                    required
                >

                <label for="email">
                    E-mail
                </label>

                <span></span>

            </div>


            <div class="txt_field">

                <input
                    type="password"
                    id="senha"
                    required
                >

                <label for="senha">
                    Senha
                </label>

                <span></span>

            </div>


            <div class="pass">
                Esqueceu a senha?
            </div>


            <br>


            <input
                type="submit"
                value="Login"
            >


            <p id="mensagem"></p>


            <div class="signup_link">

                <a href="cadastro.html">
                    Ainda não é um membro? Cadastre-se!
                </a>

            </div>

            <br>

        </form>

    </div>


    <footer>

        <p>
            ©2026-PP LS-Todos os Direitos Reservados.
        </p>

        <p>
            Essa obra não pode ser usada para fins lucrativos.
        </p>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="login.js"></script>

</body>

</html>
